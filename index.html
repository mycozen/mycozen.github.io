<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myco Zennaro | Progetti</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            /* Sfondo animato fluido: viola, rosso, blu e accento giallo */
            background: linear-gradient(-45deg, #4A00E0, #D31027, #0B192C, #F2C94C);
            background-size: 300% 300%;
            animation: gradientBG 18s ease infinite;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 4rem 2rem;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        header {
            text-align: center;
            margin-bottom: 4rem;
        }

        h1 {
            font-weight: 800;
            font-size: 3rem;
            letter-spacing: -1px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.4);
            margin-bottom: 0.5rem;
        }

        p.subtitle {
            opacity: 0.9;
            font-size: 1.2rem;
            font-weight: 300;
        }

        #repos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
            width: 100%;
            max-width: 1200px;
            flex: 1;
        }

        /* Effetto Glassmorphism Premium */
        .glass-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            /* Riflesso luce sul bordo per un vero effetto vetro */
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.3);
            border-left: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 24px;
            padding: 2rem;
            text-decoration: none;
            color: inherit;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .glass-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .repo-name {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            word-break: break-word;
            letter-spacing: -0.5px;
        }

        .repo-desc {
            font-size: 1rem;
            opacity: 0.85;
            line-height: 1.6;
            flex-grow: 1;
            font-weight: 400;
        }

        /* Footer Isola Fluttuante */
        footer {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.25);
            border-left: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 50px;
            font-size: 0.85rem;
            opacity: 0.85;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        footer:hover {
            opacity: 1;
            transform: scale(1.05);
        }
        
        .loader {
            text-align: center;
            width: 100%;
            font-size: 1.2rem;
            grid-column: 1 / -1;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <h1>I Miei Progetti</h1>
        <p class="subtitle">Seleziona una card per esplorare il progetto</p>
    </header>

    <div id="repos-grid">
        <div class="loader">Caricamento in corso...</div>
    </div>

    <footer>
        &copy; 2026 Myco Zennaro - All rights reserved.
    </footer>

    <script>
        const githubUsername = 'mycozen';

        async function loadRepositories() {
            const grid = document.getElementById('repos-grid');
            
            try {
                const response = await fetch(`https://api.github.com/users/${githubUsername}/repos?sort=updated&per_page=100`);
                
                if (!response.ok) throw new Error('Network response was not ok');
                
                const repos = await response.json();
                grid.innerHTML = ''; 

                const hideForks = true;
                
                // Filtra i fork e nasconde la repository stessa del sito per evitare doppioni
                const filteredRepos = repos.filter(repo => {
                    const isNotFork = hideForks ? !repo.fork : true;
                    const isNotSelf = repo.name.toLowerCase() !== `${githubUsername}.github.io`.toLowerCase();
                    return isNotFork && isNotSelf;
                });

                filteredRepos.forEach(repo => {
                    const card = document.createElement('a');
                    card.className = 'glass-card';
                    card.target = '_blank
